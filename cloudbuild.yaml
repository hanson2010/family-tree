# Google Cloud Build configuration for automatic deployment from GitHub
# This file configures CI/CD pipeline for the Family Tree application

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/family-tree:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/family-tree:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/family-tree:$SHORT_SHA'
    id: 'push-image-sha'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/family-tree:latest'
    id: 'push-image-latest'
    waitFor: ['build-image']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'family-tree'
      - '--image'
      - 'gcr.io/$PROJECT_ID/family-tree:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      # Caps cost under abuse; MCP limits are counted per instance
      - '--max-instances'
      - '2'
      # The app's identity: reads the secret and Firestore
      - '--service-account'
      - 'service-account-1@$PROJECT_ID.iam.gserviceaccount.com'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NEXTAUTH_URL=https://family-tree.pythoner.work,GOOGLE_CLIENT_ID=736322377109-pgnk86943obed8lu8ti7om9gklr6nbhi.apps.googleusercontent.com,GITHUB_CLIENT_ID=Ov23liaa9aU7qPjeep43,GOOGLE_AI_MODEL=gemini-3.5-flash-lite'
      - '--set-secrets'
      - 'APP_SECRETS=family-tree-app-secrets:latest'
    id: 'deploy-cloud-run'
    waitFor: ['push-image-sha']

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/family-tree:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/family-tree:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Build timeout
timeout: '1200s'
